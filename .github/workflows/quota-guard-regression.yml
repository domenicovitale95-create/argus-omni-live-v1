name: Quota Guard Regression

on:
  push:
    branches:
      - argus-payload-stability-hotfix
    paths:
      - 'api/live.js'
      - 'api/provider-status.js'
      - 'api/_report-store.js'
      - 'api/prediction-ledger.js'
      - 'api/daily-report.js'
      - 'api/shadow-mode.js'
      - 'api/daily-cron.js'
      - 'vercel.json'
      - '.github/workflows/quota-guard-regression.yml'
  pull_request:
    paths:
      - 'api/live.js'
      - 'api/provider-status.js'
      - 'api/_report-store.js'
      - 'api/prediction-ledger.js'
      - 'api/daily-report.js'
      - 'api/shadow-mode.js'
      - 'api/daily-cron.js'
      - 'vercel.json'
      - '.github/workflows/quota-guard-regression.yml'

jobs:
  quota-guard-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify persistent quota hard stop
        run: |
          grep -q "QUOTA_GUARD_PATH" api/live.js
          grep -q "persistQuotaExhausted" api/live.js
          grep -q "dailyRemaining=0" api/live.js
      - name: Verify protected daily reserve and bounded secondary calls
        run: |
          grep -Eq "MIN_DAILY_RESERVE[[:space:]]*=[[:space:]]*(1[5-9][0-9]{2}|[2-9][0-9]{3})" api/live.js
          grep -q "SECONDARY_CALL_BUDGET_PER_BUILD" api/live.js
      - name: Verify temporary zero-quota window is narrow and self-expiring
        run: |
          grep -Fq "TEMP_ZERO_QUOTA_DATE = '2026-08-22'" api/_report-store.js
          grep -Fq "pathname !== QUOTA_GUARD_PATH" api/_report-store.js
          grep -Fq "brusselsDate() !== TEMP_ZERO_QUOTA_DATE" api/_report-store.js
          grep -Fq "expiresAutomaticallyAt: '2026-08-23T00:00:00+02:00'" api/_report-store.js
      - name: Verify every settlement/report path obeys quota guard
        run: |
          grep -Fq "PROVIDER_BLOCKED_BY_QUOTA_GUARD" api/prediction-ledger.js
          grep -Fq "providerFallbackHonorsQuotaGuard:true" api/prediction-ledger.js
          grep -Fq "providerBlocked=Boolean(guard?.date===date&&guard?.exhausted)" api/daily-report.js
          grep -Fq "ARCHIVE_ONLY_QUOTA_GUARD" api/daily-report.js
          grep -Fq "providerCallSkipped:true" api/shadow-mode.js
          grep -Fq "PROVIDER_BLOCKED_BY_QUOTA_GUARD" api/shadow-mode.js
          grep -Fq "providerBlocked=Boolean(guard?.date===date&&guard?.exhausted)" api/daily-cron.js
          grep -Fq "automaticResumeOnNewBrusselsDate:true" api/daily-cron.js
      - name: Verify provider watchdog and safe autopilot cadence
        run: |
          test -f api/provider-status.js
          grep -q '"path": "/api/provider-status"' vercel.json
          grep -q '"path": "/api/autopilot", "schedule": "\*/15 \* \* \* \*"' vercel.json
