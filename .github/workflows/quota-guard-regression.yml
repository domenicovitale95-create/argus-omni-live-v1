name: Quota Guard Regression

on:
  push:
    branches: [main, fix/live-model-v2-integrity]
    paths:
      - 'api/live.js'
      - 'api/provider-status.js'
      - 'api/_report-store.js'
      - 'api/prediction-ledger-v4.js'
      - 'api/prediction-ledger.js'
      - 'api/daily-report.js'
      - 'api/shadow-mode.js'
      - 'api/daily-cron.js'
      - '.github/workflows/quota-guard-regression.yml'
  pull_request:
    paths:
      - 'api/live.js'
      - 'api/provider-status.js'
      - 'api/_report-store.js'
      - 'api/prediction-ledger-v4.js'
      - 'api/prediction-ledger.js'
      - 'api/daily-report.js'
      - 'api/shadow-mode.js'
      - 'api/daily-cron.js'
      - '.github/workflows/quota-guard-regression.yml'

jobs:
  quota-guard-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check api/live.js
          node --check api/prediction-ledger-v4.js
          node --check api/provider-status.js
          node --check api/daily-report.js
          node --check api/shadow-mode.js
          node --check api/daily-cron.js
      - name: Verify quota architecture semantically
        run: |
          node <<'NODE'
          const fs=require('fs');
          const read=p=>fs.readFileSync(p,'utf8');
          const assert=(ok,msg)=>{if(!ok){console.error(`FAIL: ${msg}`);process.exitCode=1}else console.log(`PASS: ${msg}`)};
          const live=read('api/live.js');
          const ledger=read('api/prediction-ledger-v4.js');
          const provider=read('api/provider-status.js');
          const report=read('api/daily-report.js');
          const shadow=read('api/shadow-mode.js');
          const cron=read('api/daily-cron.js');

          assert(/QUOTA_GUARD_PATH/.test(live)&&/persistQuotaExhausted/.test(live),'daily quota hard stop persists state');
          const reserve=live.match(/MIN_DAILY_RESERVE\s*=\s*(\d+)/)?.[1];
          assert(Number(reserve)>=1500,'daily reserve is at least 1500 requests');
          assert(/MINUTE_COOLDOWN_MS/.test(live)&&/minuteBlockedUntil/.test(live),'minute throttling has a separate cooldown');
          assert(/kind==='minute'/.test(live)&&/apiQuota\.exhausted=false/.test(live),'minute limit is not misclassified as daily exhaustion');
          assert(/kind==='daily'/.test(live)&&/persistQuotaExhausted/.test(live),'daily exhaustion remains fail-closed');
          assert(/SECONDARY_CALL_BUDGET_PER_BUILD/.test(live),'secondary provider calls are bounded per build');

          assert(/QUOTA_GUARD_PATH/.test(ledger)&&/providerBlocked/.test(ledger),'prediction ledger reads the quota guard');
          assert(/PROVIDER_BLOCKED_BY_QUOTA_GUARD/.test(ledger),'prediction ledger skips provider fallback while blocked');
          assert(/providerBlocked/.test(report)&&/QUOTA_GUARD/.test(report),'daily report honors quota guard');
          assert(/providerCallSkipped/.test(shadow)&&/QUOTA_GUARD/.test(shadow),'shadow mode honors quota guard');
          assert(/providerBlocked/.test(cron)&&/quota/i.test(cron),'daily cron honors quota state');
          assert(/QUOTA_GUARD_PATH/.test(provider)&&/MINUTE_RATE_LIMIT_RECOVERABLE/.test(provider)&&/providerCallSkipped/.test(provider),'provider status repairs minute throttles and preserves hard-stop safety');

          if(process.exitCode)process.exit(process.exitCode);
          NODE
