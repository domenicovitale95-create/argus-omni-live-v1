name: Historical Recent Overlay Regression

on:
  push:
    branches: [main]
    paths:
      - 'api/historical-recent-backfill.js'
      - 'api/streak-intelligence.js'
      - '.github/workflows/argus-autonomous-scheduler.yml'
      - 'scripts/historical-recent-overlay-regression.mjs'
      - '.github/workflows/historical-recent-overlay-regression.yml'
  pull_request:
    paths:
      - 'api/historical-recent-backfill.js'
      - 'api/streak-intelligence.js'
      - '.github/workflows/argus-autonomous-scheduler.yml'
      - 'scripts/historical-recent-overlay-regression.mjs'
      - '.github/workflows/historical-recent-overlay-regression.yml'

permissions:
  contents: read

jobs:
  sharded-continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify historical recent overlay invariants
        run: node scripts/historical-recent-overlay-regression.mjs
