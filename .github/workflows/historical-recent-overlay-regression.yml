name: Historical Recent Overlay Regression

on:
  push:
    branches: [main]
    paths:
      - 'api/historical-recent-backfill.js'
      - 'api/streak-intelligence.js'
      - 'vercel.json'
      - '.github/workflows/historical-recent-overlay-regression.yml'
  pull_request:
    paths:
      - 'api/historical-recent-backfill.js'
      - 'api/streak-intelligence.js'
      - 'vercel.json'
      - '.github/workflows/historical-recent-overlay-regression.yml'

permissions:
  contents: read

jobs:
  sharded-continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify recent backfill is sharded and quota-aware
        run: |
          grep -Fq "PREFIX='argus/research/historical-recent/'" api/historical-recent-backfill.js
          grep -Fq "monthPath(date)" api/historical-recent-backfill.js
          grep -Fq "MIGRATION_FLOOR='2026-08-19'" api/historical-recent-backfill.js
          grep -Fq "guard?.date===today&&guard?.exhausted" api/historical-recent-backfill.js
          grep -Fq "status:'PAUSED_QUOTA_GUARD'" api/historical-recent-backfill.js
          grep -Fq "providerCalls:0" api/historical-recent-backfill.js
          grep -Fq "status:'DRY_RUN'" api/historical-recent-backfill.js
          grep -Fq "noLegacyRewrite:true" api/historical-recent-backfill.js
      - name: Verify incomplete dates are deferred rather than certified
        run: |
          grep -Fq "ACTIVE_OR_SCHEDULED" api/historical-recent-backfill.js
          grep -Fq "settlementReady:active.length===0" api/historical-recent-backfill.js
          grep -Fq "DEFERRED_UNSETTLED" api/historical-recent-backfill.js
          grep -Fq "activeOrScheduledDatesDeferred:true" api/historical-recent-backfill.js
      - name: Verify streak continuity can use only certified sources
        run: |
          grep -Fq "archive?.dates?.[date]?.complete||recentIndex?.dates?.[date]?.complete" api/streak-intelligence.js
          grep -Fq "archiveContinuous(archive,recentIndex" api/streak-intelligence.js
          grep -Fq "noGapFilling:true" api/streak-intelligence.js
          grep -Fq "olderMatchesNeverSubstitute:true" api/streak-intelligence.js
          grep -Fq "continuityMayUseLegacyOrCertifiedRecentOverlay:true" api/streak-intelligence.js
      - name: Verify cron no longer targets oversized legacy monolith
        run: |
          grep -Fq '"path": "/api/historical-recent-backfill?dates=6", "schedule": "15 1 * * *"' vercel.json
          ! grep -Fq '"path": "/api/historical-decade-backfill?dates=6"' vercel.json
