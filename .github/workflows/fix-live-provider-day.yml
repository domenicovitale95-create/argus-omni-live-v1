name: Fix LIVE Provider Day

on:
  push:
    paths:
      - '.github/workflows/fix-live-provider-day.yml'

permissions:
  contents: write

jobs:
  patch-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch LIVE quota guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('api/live.js')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "function isQuotaError(data){const text=JSON.stringify(data?.errors||{}).toLowerCase();return text.includes('request limit')||text.includes('rate limit')||text.includes('too many requests')}",
              "function isQuotaError(data){const text=JSON.stringify(data?.errors||{}).toLowerCase();return text.includes('request limit')||text.includes('rate limit')||text.includes('too many requests')}\nfunction providerDayUtc(date=new Date()){return date.toISOString().slice(0,10)}\nfunction quotaGuardDay(state){if(!state)return null;const recorded=state.providerDayUtc||null;const observed=state.observedAt?String(state.observedAt).slice(0,10):null;return recorded||observed||state.date||null}",
              'insert UTC provider-day helpers',
          )

          replace_once(
              "async function persistQuotaExhausted(data){\n  apiQuota.dailyLimit=Number(apiQuota.dailyLimit)||7500;apiQuota.dailyRemaining=0;apiQuota.exhausted=true;apiQuota.providerError=JSON.stringify(data?.errors||data||{});apiQuota.observedAt=new Date().toISOString();\n  if(storageReady())try{await writeJson(QUOTA_GUARD_PATH,{date:todayInTimezone(),exhausted:true,dailyLimit:apiQuota.dailyLimit,dailyRemaining:0,providerError:apiQuota.providerError,observedAt:apiQuota.observedAt})}catch(_){}\n}",
              "async function persistQuotaExhausted(data){\n  apiQuota.dailyLimit=Number(apiQuota.dailyLimit)||7500;apiQuota.dailyRemaining=0;apiQuota.exhausted=true;apiQuota.providerError=JSON.stringify(data?.errors||data||{});apiQuota.observedAt=new Date().toISOString();\n  const day=providerDayUtc();\n  if(storageReady())try{await writeJson(QUOTA_GUARD_PATH,{date:day,providerDayUtc:day,exhausted:true,dailyLimit:apiQuota.dailyLimit,dailyRemaining:0,providerError:apiQuota.providerError,observedAt:apiQuota.observedAt})}catch(_){}\n}",
              'persist exhausted quota using UTC provider day',
          )

          replace_once(
              "async function loadQuotaGuard(){\n  if(!storageReady())return;\n  try{const state=await readJson(QUOTA_GUARD_PATH,null);if(state?.date===todayInTimezone()&&state?.exhausted){apiQuota={...apiQuota,dailyLimit:Number(state.dailyLimit)||7500,dailyRemaining:0,exhausted:true,providerError:state.providerError||'DAILY_QUOTA_EXHAUSTED',observedAt:state.observedAt||new Date().toISOString()}}else if(state?.date&&state.date!==todayInTimezone()){apiQuota.exhausted=false;apiQuota.providerError=null;apiQuota.dailyRemaining=null}}catch(_){}\n}",
              "async function loadQuotaGuard(){\n  if(!storageReady())return;\n  try{const state=await readJson(QUOTA_GUARD_PATH,null),currentDay=providerDayUtc(),guardDay=quotaGuardDay(state);if(state?.exhausted&&guardDay===currentDay){apiQuota={...apiQuota,dailyLimit:Number(state.dailyLimit)||7500,dailyRemaining:0,exhausted:true,providerError:state.providerError||'DAILY_QUOTA_EXHAUSTED',observedAt:state.observedAt||new Date().toISOString()}}else if(state?.exhausted&&guardDay&&guardDay!==currentDay){apiQuota.exhausted=false;apiQuota.providerError=null;apiQuota.dailyRemaining=null}}catch(_){}\n}",
              'load quota guard using UTC provider day',
          )

          replace_once(
              "function quotaMeta(){return {...apiQuota,plan:providerPlanMeta(),dynamicReserve:dynamicDailyReserve(),liveReserve:LIVE_DAILY_RESERVE,secondaryCallBudgetPerBuild:SECONDARY_CALL_BUDGET_PER_BUILD,buildExternalCalls}}",
              "function quotaMeta(){return {...apiQuota,providerDayUtc:providerDayUtc(),plan:providerPlanMeta(),dynamicReserve:dynamicDailyReserve(),liveReserve:LIVE_DAILY_RESERVE,secondaryCallBudgetPerBuild:SECONDARY_CALL_BUDGET_PER_BUILD,buildExternalCalls}}",
              'expose UTC provider day in quota metadata',
          )

          path.write_text(text)
          PY

          node --check api/live.js
          grep -q "providerDayUtc" api/live.js
          grep -q "providerDayUtc:day" api/live.js
          grep -q "date=todayInTimezone()" api/live.js

      - name: Commit correction
        shell: bash
        run: |
          if git diff --quiet -- api/live.js; then
            echo 'No change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/live.js
          git commit -m 'fix: align LIVE quota guard with provider UTC day'
          git push
