name: Prediction Archive Client Regression

on:
  pull_request:
    paths:
      - 'src/official-decisions.js'
      - 'tests/prediction-archive-client-regression.mjs'
      - '.github/workflows/prediction-archive-client-regression.yml'
  push:
    branches: [main]
    paths:
      - 'src/official-decisions.js'
      - 'tests/prediction-archive-client-regression.mjs'
      - '.github/workflows/prediction-archive-client-regression.yml'

permissions:
  contents: read

jobs:
  prediction-archive-client:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/prediction-archive-client-regression.mjs
