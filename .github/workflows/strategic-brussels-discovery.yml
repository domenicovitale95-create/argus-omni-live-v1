name: Strategic Brussels Discovery

on:
  push:
    branches: [main]
    paths:
      - 'scripts/strategic-discovery.mjs'
      - 'data/strategic-discovery-feeds.json'
      - '.github/workflows/strategic-brussels-discovery.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Discovery depth
        required: false
        default: weekly
        type: choice
        options: [weekly, monthly]
  schedule:
    - cron: '17 5 * * 1'
    - cron: '41 4 1 * *'

permissions:
  contents: write

concurrency:
  group: strategic-brussels-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "41 4 1 * *" ]; then MODE="monthly"; else MODE="weekly"; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Scan official sources
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "monthly" ]; then
            node scripts/strategic-discovery.mjs --monthly
          else
            node scripts/strategic-discovery.mjs
          fi
      - name: Validate neighborhood coverage
        run: |
          node -e "const fs=require('fs');const n=JSON.parse(fs.readFileSync('data/strategic-neighborhoods.json','utf8'));const ds=Array.isArray(n.districts)?n.districts:[];const valid=ds.filter(d=>d.center&&Number.isFinite(d.center.lat)&&Number.isFinite(d.center.lng)&&d.center.lat>=50&&d.center.lat<=51.1&&d.center.lng>=4&&d.center.lng<=5).length;const min=Math.floor(ds.length*.9);if(n.status!=='LIVE'||!Number.isInteger(n.count)||n.count<1||ds.length!==n.count||valid<min){console.error('Invalid Strategic Brussels neighborhood registry', {status:n.status,count:n.count,districts:ds.length,validCenters:valid,minValidCenters:min});process.exit(1)}"
      - name: Commit snapshot if changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/strategic-watch-snapshot.json data/strategic-neighborhoods.json)" ]; then
            echo "No strategic discovery change."
            exit 0
          fi
          git config user.name "argus-strategic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/strategic-watch-snapshot.json data/strategic-neighborhoods.json
          git commit -m "data(strategic): refresh Brussels discovery snapshot"
          git push
