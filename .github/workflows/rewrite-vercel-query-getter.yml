name: Rewrite Vercel Query Getter

on:
  push:
    branches:
      - fix/vercel-query-dep0169-20260827
    paths:
      - 'scripts/rewrite-vercel-query-getter.mjs'
      - '.github/workflows/rewrite-vercel-query-getter.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vercel-query-dep0169-20260827
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rewrite direct API req.query access
        run: node scripts/rewrite-vercel-query-getter.mjs
      - name: Verify legacy getter token is gone from direct API files
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --include='*.js' --exclude='_request-query.js' -E 'req\??\.query' api; then
            echo '::error::Direct req.query access remains in api/' >&2
            exit 1
          fi
      - name: Commit migration output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'argus-runtime-hardening'
          git config user.email 'actions@users.noreply.github.com'
          git add api
          git commit -m 'fix: eliminate Vercel req.query legacy getter usage'
          git push origin HEAD:fix/vercel-query-dep0169-20260827
