name: ARGUS Integration Gate

on:
  push:
    branches:
      - argus-autonomous-learning-loop
      - 'argus-autonomous-learning-loop-*'
      - argus-match-universe-learning
      - 'autopilot/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: argus-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Syntax, integration, golden and readiness invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run bounded integration verification
        run: node scripts/verify-integration.mjs

      - name: Run deterministic governance and temporal golden fixtures
        run: node scripts/verify-golden-fixtures.mjs

      - name: Verify Match-Universe scheduler safety boundaries
        run: node scripts/verify-match-universe.mjs

      - name: Verify autopilot transient outage degradation
        run: node scripts/verify-autopilot-transient-degrade.mjs

      - name: Run deployment readiness and rollback gate
        run: node scripts/verify-deployment-readiness.mjs
