name: Runtime Deprecation Regression

on:
  pull_request:
    paths:
      - 'package.json'
      - 'scripts/patch-web-push-url.mjs'
      - 'api/push-dispatch.js'
      - '.github/workflows/runtime-deprecation-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dep0169-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and apply deterministic runtime patch
        run: npm install --no-audit --no-fund
      - name: Reject legacy url.parse in web-push runtime
        shell: bash
        run: |
          set -euo pipefail
          TARGET='node_modules/web-push/src/web-push-lib.js'
          test -f "$TARGET"
          if grep -nE '(^|[^A-Za-z0-9_])url\.parse\(' "$TARGET"; then
            echo '::error::DEP0169 regression: web-push runtime contains legacy url.parse().' >&2
            exit 1
          fi
          if grep -n "require('url')" "$TARGET"; then
            echo '::error::Legacy node url module import remains in web-push runtime.' >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import webpush from 'web-push';
          for (const name of ['setVapidDetails','sendNotification','generateRequestDetails']) {
            if (typeof webpush[name] !== 'function') throw new Error(`Missing web-push export: ${name}`);
          }
          console.log('DEP0169 guard passed: npm package integrity preserved, deterministic patch applied, expected exports present.');
          NODE
