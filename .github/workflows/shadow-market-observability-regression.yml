name: Shadow Market Observability Regression

on:
  push:
    branches: [main, argus/shadow-market-observability]
  pull_request:

jobs:
  shadow-market-observability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check api/_shadow-market-observability.js
          node --check api/shadow-market-observability.js
          node --check tests/shadow-market-observability-regression.mjs
      - name: Market-family observability regression suite
        run: node tests/shadow-market-observability-regression.mjs
