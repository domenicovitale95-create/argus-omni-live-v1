name: ARGUS Autonomous Scheduler

on:
  schedule:
    # Vercel is primary. GitHub is backup-only for fast-cycle/supervisor recovery
    # plus low-frequency maintenance; it must not duplicate normal primary work.
    # Scheduler registration heartbeat: 2026-08-28 (no cadence or policy change).
    - cron: '13,43 * * * *'
    - cron: '23 * * * *'
    - cron: '17 0,6,12,18 * * *'
    - cron: '23 1 * * *'
    - cron: '37 2 * * *'
    - cron: '43 7 * * *'
    - cron: '53 21,22 * * *'
  workflow_dispatch:
    inputs:
      group:
        description: Scheduler group to run
        required: true
        default: all
        type: choice
        options:
          - all
          - fast
          - watchdog
          - quarter
          - hourly
          - sixhour
          - daily1
          - daily2
          - morning
          - evening

permissions:
  contents: read

concurrency:
  group: argus-scheduler-${{ github.event.schedule }}-${{ inputs.group }}
  cancel-in-progress: false

jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARGUS_BASE_URL: ${{ secrets.ARGUS_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Run autonomous scheduler group
        shell: bash
        run: |
          set -uo pipefail

          BASE="${ARGUS_BASE_URL:-https://argus-omni-live.vercel.app}"
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::GitHub Actions secret CRON_SECRET is not configured."
            exit 1
          fi

          failures=0
          call() {
            local path="$1"
            local label="$2"
            echo "::group::${label}"
            if curl --fail-with-body --silent --show-error --max-time 240 \
              --retry 2 --retry-delay 3 --retry-all-errors \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${BASE}${path}"; then
              echo
              echo "OK: ${label}"
            else
              code=$?
              echo
              echo "::error::${label} failed with curl exit code ${code}"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          }

          run_fast() {
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              call '/api/fast-cycle?source=github-manual' 'Fast cycle manual run'
              return
            fi

            echo "::group::Fast-cycle backup guard"
            local health status age backup
            if ! health="$(curl --fail-with-body --silent --show-error --max-time 30 \
              --retry 1 --retry-delay 2 --retry-all-errors \
              "${BASE}/api/fast-cycle-health")"; then
              echo "Fast-cycle health probe failed; invoking GitHub backup."
              echo "::endgroup::"
              call '/api/fast-cycle?source=github-backup' 'Fast cycle backup recovery'
              return
            fi

            echo "${health}"
            status="$(printf '%s' "${health}" | jq -r '.status // "UNKNOWN"')"
            age="$(printf '%s' "${health}" | jq -r '.ageMinutes // 999999')"
            backup="$(printf '%s' "${health}" | jq -r '.backupRequired // true')"
            if ! [[ "${age}" =~ ^[0-9]+$ ]]; then age=999999; fi

            if [ "${backup}" = "true" ]; then
              echo "Backup required: status=${status}, ageMinutes=${age}."
              echo "::endgroup::"
              call '/api/fast-cycle?source=github-backup' 'Fast cycle backup recovery'
            else
              echo "Primary Vercel fast cycle healthy: status=${status}, age=${age}m. No duplicate work."
              echo "::endgroup::"
            fi
          }

          run_watchdog() {
            echo "::group::Autonomy watchdog"
            local health age status
            if ! health="$(curl --fail-with-body --silent --show-error --max-time 30 \
              --retry 1 --retry-delay 2 --retry-all-errors \
              "${BASE}/api/autonomy-health")"; then
              echo "Health probe failed; invoking backup supervisor."
              echo "::endgroup::"
              call '/api/autonomous-supervisor' 'Autonomous supervisor backup recovery'
              return
            fi

            echo "${health}"
            age="$(printf '%s' "${health}" | jq -r '.heartbeatAgeMinutes // 999999')"
            status="$(printf '%s' "${health}" | jq -r '.status // "UNKNOWN"')"

            if ! [[ "${age}" =~ ^[0-9]+$ ]]; then
              age=999999
            fi

            # Primary supervisor cadence is 30m. Recovery starts only after a
            # genuinely missed heartbeat, not during normal scheduler jitter.
            if [ "${age}" -gt 50 ] || [ "${status}" = "LATE" ] || [ "${status}" = "STALE" ] || [ "${status}" = "CRITICAL" ] || [ "${status}" = "WAITING" ]; then
              echo "Backup required: status=${status}, heartbeatAgeMinutes=${age}."
              echo "::endgroup::"
              call '/api/autonomous-supervisor' 'Autonomous supervisor backup recovery'
            else
              echo "Primary Vercel heartbeat healthy: status=${status}, age=${age}m. No duplicate supervisor call."
              echo "::endgroup::"
            fi
          }

          # The following groups are manual-only unless explicitly scheduled below.
          # They are kept for recovery/maintenance without creating duplicate normal work.
          run_quarter() {
            call '/api/autopilot' 'Autopilot'
            call '/api/paper-learning?mode=run' 'Paper learning'
            call '/api/deployment-verifier' 'Deployment verifier'
          }

          run_hourly() {
            call '/api/provider-status' 'Provider status'
            call '/api/profitability-proof' 'Profitability proof'
            call '/api/cognitive-gpt-review' 'Cognitive GPT review'
            call '/api/shadow-cron' 'Shadow cron'
            call '/api/site-self-test' 'Site self-test'
          }

          run_sixhour() {
            call '/api/self-improvement-loop' 'Self-improvement loop'
            call '/api/cognitive-cycle' 'Cognitive cycle'
            call '/api/policy-governance-cycle' 'Policy governance cycle'
          }

          run_daily1() {
            call '/api/historical-recent-backfill?dates=6' 'Historical recent backfill'
            call '/api/historical-market-outcomes' 'Historical market outcomes'
            call '/api/historical-recent-stats-enrichment?fixtures=4' 'Historical stats enrichment'
            call '/api/streak-intelligence' 'Streak intelligence'
          }

          run_daily2() {
            call '/api/historical-archive-health' 'Historical archive health'
            call '/api/historical-candidate-gate' 'Historical candidate gate'
            call '/api/profitability-proof' 'Profitability proof'
          }

          run_morning() {
            call '/api/daily-slip' 'Daily slip'
          }

          run_evening() {
            call '/api/daily-cron' 'Daily cron'
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GROUP="${{ inputs.group }}"
          else
            case "${{ github.event.schedule }}" in
              '13,43 * * * *') GROUP='fast' ;;
              '23 * * * *') GROUP='watchdog' ;;
              '17 0,6,12,18 * * *') GROUP='sixhour' ;;
              '23 1 * * *') GROUP='daily1' ;;
              '37 2 * * *') GROUP='daily2' ;;
              '43 7 * * *') GROUP='morning' ;;
              '53 21,22 * * *') GROUP='evening' ;;
              *) GROUP='all' ;;
            esac
          fi

          echo "ARGUS scheduler group: ${GROUP}"
          echo "ARGUS base URL: ${BASE}"

          case "${GROUP}" in
            fast) run_fast ;;
            watchdog) run_watchdog ;;
            quarter) run_quarter ;;
            hourly) run_hourly ;;
            sixhour) run_sixhour ;;
            daily1) run_daily1 ;;
            daily2) run_daily2 ;;
            morning) run_morning ;;
            evening) run_evening ;;
            all)
              run_fast
              run_watchdog
              run_quarter
              run_hourly
              run_sixhour
              run_daily1
              run_daily2
              run_morning
              run_evening
              ;;
            *)
              echo "::error::Unknown scheduler group: ${GROUP}"
              exit 2
              ;;
          esac

          if [ "${failures}" -gt 0 ]; then
            echo "::error::ARGUS scheduler completed with ${failures} failed endpoint(s)."
            exit 1
          fi

          echo "ARGUS scheduler completed successfully."
