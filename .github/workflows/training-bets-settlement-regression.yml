name: Training bets settlement regression

on:
  push:
    branches: [main]
    paths:
      - 'api/training-bets-v1.js'
      - 'training-bets.html'
      - 'tests/training-bets-settlement-regression.mjs'
      - '.github/workflows/training-bets-settlement-regression.yml'
  pull_request:
    paths:
      - 'api/training-bets-v1.js'
      - 'training-bets.html'
      - 'tests/training-bets-settlement-regression.mjs'
      - '.github/workflows/training-bets-settlement-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check training settlement fairness and UI states
        run: node tests/training-bets-settlement-regression.mjs
