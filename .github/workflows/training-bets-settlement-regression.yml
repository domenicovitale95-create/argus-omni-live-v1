name: Training bets settlement regression

on:
  push:
    branches: [main]
    paths:
      - 'api/training-bets-v1.js'
      - 'training-bets.html'
      - 'tests/training-bets-settlement-regression.mjs'
      - '.github/workflows/training-bets-settlement-regression.yml'
  pull_request:
    paths:
      - 'api/training-bets-v1.js'
      - 'training-bets.html'
      - 'tests/training-bets-settlement-regression.mjs'
      - '.github/workflows/training-bets-settlement-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check training settlement fairness and UI states
        run: node tests/training-bets-settlement-regression.mjs


  production-reconcile:
    needs: regression
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARGUS_BASE_URL: ${{ secrets.ARGUS_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Reconcile overdue training results with verified provider data
        shell: bash
        run: |
          set -euo pipefail
          BASE="${ARGUS_BASE_URL:-https://argus-omni-live.vercel.app}"
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is not configured."
            exit 1
          fi

          ready=0
          for attempt in $(seq 1 120); do
            before="$(curl --fail-with-body --silent --show-error --max-time 60 "${BASE}/api/training-bets")"
            if echo "${before}" | jq -e '.version == "TRAINING-BETS-3"' >/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "${ready}" -ne 1 ]; then
            echo "::error::TRAINING-BETS-3 was not serving in production."
            exit 1
          fi

          curl --fail-with-body --silent --show-error --max-time 240 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE}/api/training-bets-cron" > /tmp/training-reconcile.json

          jq '{
            summary,
            run: {
              captured: .run.captured,
              settled: .run.settled,
              settledLedger: .run.settledLedger,
              settledProvider: .run.settledProvider,
              providerCalls: .run.providerCalls,
              providerFixtureLookups: .run.providerFixtureLookups,
              providerRescheduled: .run.providerRescheduled,
              providerSettlementReason: .run.providerSettlementReason,
              providerSettlementDates: .run.providerSettlementDates,
              providerSettlementError: .run.providerSettlementError
            },
            settlementProbe
          }' /tmp/training-reconcile.json

          after="$(curl --fail-with-body --silent --show-error --max-time 60 "${BASE}/api/training-bets")"
          echo "${after}" | jq '{summary, settlementProbe}'
