name: ARGUS Daily Prediction Report

on:
  schedule:
    - cron: '55 23 * * *'
      timezone: 'Europe/Brussels'
  workflow_dispatch:

jobs:
  settle-daily-predictions:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ARGUS report date
        id: report_date
        shell: bash
        run: |
          HOUR=$(TZ=Europe/Brussels date +%H)
          if [ "$HOUR" -lt 6 ]; then
            REPORT_DATE=$(TZ=Europe/Brussels date -d 'yesterday' +%F)
          else
            REPORT_DATE=$(TZ=Europe/Brussels date +%F)
          fi
          echo "date=$REPORT_DATE" >> "$GITHUB_OUTPUT"

      - name: Generate daily prediction report
        env:
          REPORT_CRON_SECRET: ${{ secrets.REPORT_CRON_SECRET }}
          REPORT_DATE: ${{ steps.report_date.outputs.date }}
        run: |
          curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${REPORT_CRON_SECRET}" \
            "https://argus-omni-live.vercel.app/api/daily-report?date=${REPORT_DATE}"
