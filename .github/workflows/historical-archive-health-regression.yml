name: Historical Archive Health Regression

on:
  push:
    branches: [main]
    paths:
      - 'api/historical-archive-health.js'
      - '.github/workflows/historical-archive-health-regression.yml'
  pull_request:
    paths:
      - 'api/historical-archive-health.js'
      - '.github/workflows/historical-archive-health-regression.yml'

permissions:
  contents: read

jobs:
  provider-free-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify archive health is diagnostic only
        run: |
          grep -Fq "readJson(ARCHIVE,null)" api/historical-archive-health.js
          grep -Fq "readJson(STATE,null)" api/historical-archive-health.js
          grep -Fq "readJson(RECENT_INDEX" api/historical-archive-health.js
          grep -Fq "providerCalls:false" api/historical-archive-health.js
          grep -Fq "writes:false" api/historical-archive-health.js
          grep -Fq "doesNotRelaxTrendIntegrity:true" api/historical-archive-health.js
      - name: Verify combined certified continuity is measured explicitly
        run: |
          grep -Fq "combinedRecentCompleteDays" api/historical-archive-health.js
          grep -Fq "firstCombinedGaps" api/historical-archive-health.js
          grep -Fq "RECENT_CONTINUITY_HEALTHY" api/historical-archive-health.js
          grep -Fq "LEGACY_GUARD_OVERLAY_EMPTY" api/historical-archive-health.js
          grep -Fq "combinedContinuityUsesCertifiedDatesOnly:true" api/historical-archive-health.js
      - name: Verify backfill memory guard is observable
        run: |
          grep -Fq "MEMORY_GUARD_BYTES=24*1024*1024" api/historical-archive-health.js
          grep -Fq "archiveSizeBytes" api/historical-archive-health.js
          grep -Fq "BACKFILL_MEMORY_GUARD_TRIGGERED" api/historical-archive-health.js
          grep -Fq "memoryGuardObserved:true" api/historical-archive-health.js
