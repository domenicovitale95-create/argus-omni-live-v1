name: Source calibration and training audit regression

on:
  push:
    branches: [main]
    paths:
      - 'api/calibration-impact.js'
      - 'api/decision-scheduler.js'
      - 'api/training-bias.js'
      - '.github/workflows/source-calibration-regression.yml'
  pull_request:
    paths:
      - 'api/calibration-impact.js'
      - 'api/decision-scheduler.js'
      - 'api/training-bias.js'
      - '.github/workflows/source-calibration-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-calibration-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          node --check api/calibration-impact.js
          node --check api/decision-scheduler.js
          node --check api/training-bias.js
      - name: Assert conservative OOS calibration gates
        shell: bash
        run: |
          set -euo pipefail
          f='api/calibration-impact.js'

          # Calibration may only roll out after a substantial, source-matched
          # out-of-sample evidence base. Keep these assertions tied to the
          # governed constants instead of brittle inlined magic numbers.
          grep -Fq "MAX_SIDE_ADJ=.025" "$f"
          grep -Fq "SOURCE_ROLLOUT_SCALE=.50" "$f"
          grep -Fq "SOURCE_MIN_SAMPLE=100" "$f"
          grep -Fq "SOURCE_MIN_TOTAL=600" "$f"
          grep -Fq "Number(probCal?.settled)<SOURCE_MIN_TOTAL" "$f"
          grep -Fq "p.status==='VALIDATED'" "$f"
          grep -Fq "sourceMarket" "$f"
          grep -Fq "API-FOOTBALL-PREDICTIONS" "$f"
          grep -Fq "maxAbsoluteSideAdjustmentPct" "$f"
          grep -Fq "mayBypassGate:false" "$f"
          grep -Fq "primeRequiresNormalDownstreamGates:true" "$f"
      - name: Assert model-market audit fields survive scheduler
        shell: bash
        run: |
          set -euo pipefail
          f='api/decision-scheduler.js'
          grep -Fq "modelProbability:c.modelProbability" "$f"
          grep -Fq "marketProbability:c.marketProbability" "$f"
          grep -Fq "rawEdgePct:c.rawEdgePct" "$f"
          grep -Fq "source:c.source" "$f"
          grep -Fq "marketFusion:c.marketFusion" "$f"
      - name: Assert bias diagnostic never forces selection balance
        shell: bash
        run: |
          set -euo pipefail
          f='api/training-bias.js'
          grep -Fq "forceSelectionBalance:false" "$f"
          grep -Fq "HOME_MISSING_1X2" "$f"
          grep -Fq "SELECTION_CONCENTRATION_HIGH" "$f"
          grep -Fq "OOS_CALIBRATION_WARNING" "$f"
          grep -Fq "PROSPECTIVE_AUDITED" "$f"
          grep -Fq "LEGACY_INCOMPLETE" "$f"
          echo 'PASS: source calibration is conservative, source-segmented, auditable, and selection-neutral.'
