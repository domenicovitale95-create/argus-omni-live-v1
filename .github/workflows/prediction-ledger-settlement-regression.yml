name: Prediction Ledger Settlement Regression

on:
  push:
    branches: [main]
    paths:
      - 'api/prediction-ledger-v4.js'
      - 'api/prediction-ledger-cron.js'
      - 'api/fast-cycle.js'
      - '.github/workflows/prediction-ledger-settlement-regression.yml'
  pull_request:
    paths:
      - 'api/prediction-ledger-v4.js'
      - 'api/prediction-ledger-cron.js'
      - 'api/fast-cycle.js'
      - '.github/workflows/prediction-ledger-settlement-regression.yml'

permissions:
  contents: read

jobs:
  settlement-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          node --check api/prediction-ledger-v4.js
          node --check api/prediction-ledger-cron.js
          node --check api/fast-cycle.js
      - name: Verify fast settlement and provider-throttle invariants
        run: |
          node <<'NODE'
          const fs=require('fs');
          const assert=require('assert');
          const ledger=fs.readFileSync('api/prediction-ledger-v4.js','utf8');
          const cron=fs.readFileSync('api/prediction-ledger-cron.js','utf8');
          const fast=fs.readFileSync('api/fast-cycle.js','utf8');
          assert(ledger.includes("const SETTLEMENT_DUE_AFTER_MS=150*60*1000;"),'missing 150-minute maturity threshold');
          assert(ledger.includes("const SETTLEMENT_PROVIDER_RECHECK_MS=30*60*1000;"),'missing 30-minute provider throttle');
          assert(ledger.includes("const settlementCheckPath=d=>`argus/health/prediction-ledger-settlement-${d}.json`;"),'settlement throttle state must live outside canonical ledger prefix');
          assert(!ledger.includes("const settlementCheckPath=d=>`argus/ledger/"),'throttle state must never pollute canonical ledger books');
          assert(ledger.includes("dueRecords=unsettled.filter(r=>settlementDue(r,nowMs))"),'provider eligibility must be derived from mature pending records');
          assert(ledger.includes("providerEligibleIds=pendingIds.filter(id=>providerRecheckDue(lastChecks[id],nowMs))"),'provider recheck must be throttled per mature fixture');
          assert(ledger.includes("providerFallbackOnlyForMatureFixtures:true"),'public policy must expose mature-only provider fallback');
          assert(ledger.includes("providerRecheckMinutes:SETTLEMENT_PROVIDER_RECHECK_MS/60000"),'provider recheck cadence must be exposed');
          assert(ledger.includes("fastCycleReconciliation:true"),'ledger policy must expose fast-cycle reconciliation');
          assert(cron.includes('function daytimeFastReconcile(c)'),'fast daytime settlement guard missing');
          assert(cron.includes("reason:'DAYTIME_FAST_RECONCILE'"),'fast daytime settlement invocation missing');
          assert(cron.includes('daytimeSettlementCadenceMinutes:5'),'daytime settlement must reconcile every fast cycle');
          assert(cron.includes('providerRecheckMinutes:30'),'cron policy must preserve 30-minute provider throttle');
          const ledgerJob=fast.indexOf("{path:'/api/prediction-ledger-cron'");
          const bankrollJob=fast.indexOf("{path:'/api/virtual-bankroll?mode=run'");
          assert(ledgerJob>=0&&bankrollJob>ledgerJob,'Prediction Ledger must run before Virtual Bankroll');
          assert(ledger.includes('automaticWagering:false'),'real wagering safety flag missing from ledger');
          assert(cron.includes('automaticWagering:false'),'real wagering safety flag missing from ledger cron');
          assert(fast.includes('automaticRealWagering:false'),'real wagering safety flag missing from fast cycle');
          NODE

# Preview deployment intentionally forced to validate the complete Vercel build before merge.
