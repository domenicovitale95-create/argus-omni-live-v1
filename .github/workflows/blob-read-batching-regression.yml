name: Blob Read Batching Regression

on:
  pull_request:
    paths:
      - 'api/_report-store.js'
      - 'tests/blob-read-batching-regression.mjs'
      - '.github/workflows/blob-read-batching-regression.yml'
  push:
    branches:
      - main
    paths:
      - 'api/_report-store.js'
      - 'tests/blob-read-batching-regression.mjs'
      - '.github/workflows/blob-read-batching-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/blob-read-batching-regression.mjs
