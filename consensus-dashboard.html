<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Consensus — ARGUS OMNI</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#111318;--card:#191d22;--line:rgba(255,255,255,.08);--text:#f3f0e9;--muted:#aaa69f;--good:#829b78;--warn:#c6975d;--bad:#b96a61}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif}.page{width:min(1180px,92vw);margin:auto}.nav{min-height:72px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.nav a{color:var(--text);text-decoration:none}.hero{margin:28px 0 16px;padding:34px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,rgba(116,138,167,.12),rgba(25,29,34,.97))}.eyebrow{font-size:9px;letter-spacing:.15em;color:var(--muted);font-weight:800}.hero h1{font:700 clamp(38px,5vw,64px)/.98 "Space Grotesk";margin:8px 0 12px}.hero p{color:var(--muted);max-width:800px;line-height:1.6}.grid{display:grid;gap:10px;margin-bottom:30px}.card{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:20px}.head{display:flex;justify-content:space-between;gap:16px}.head h3{font:600 21px "Space Grotesk";margin:4px 0}.meta{color:var(--muted);font-size:10px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:15px}.metric{background:rgba(255,255,255,.035);padding:12px;border-radius:12px}.metric span{display:block;color:var(--muted);font-size:8px}.metric strong{display:block;margin-top:5px}.status{padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.05);font-size:8px;font-weight:800}.status.MODEL_CONFLICT{color:var(--bad)}.status.DIVERGENT{color:var(--warn)}.status.STRONG_CONSENSUS,.status.CONSENSUS{color:var(--good)}.sources{margin-top:12px;color:var(--muted);font-size:10px}.empty{padding:28px;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}@media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}.head{flex-direction:column}}</style></head><body><div class="page"><header class="nav"><a href="/"><strong>ARGUS OMNI</strong></a><a href="training-dashboard.html">TRAINING →</a></header><main><section class="hero"><div class="eyebrow">MODEL CONSENSUS CONTROL</div><h1>Agreement before confidence.</h1><p>ARGUS compares independent evidence layers before allowing a strong signal. A high edge with model conflict is downgraded instead of promoted.</p></section><div id="grid" class="grid"><div class="empty">Reading cached ARGUS evidence…</div></div></main></div><script src="src/model-consensus.js"></script><script src="src/adaptive-weights-client.js"></script><script src="src/engine.js"></script><script src="src/training-memory.js"></script><script src="src/market-engine.js"></script><script src="src/model-consensus-integration.js"></script><script src="src/reliability.js"></script><script src="src/live-regime.js"></script><script src="src/governance.js"></script><script src="src/model-consensus-governance.js"></script><script>const grid=document.getElementById('grid');function cache(){try{return JSON.parse(localStorage.getItem('argus-live-cache-v5')||'null')?.matches||[]}catch(_){return[]}}function render(){const matches=cache().filter(m=>!m.isFinished);if(!matches.length){grid.innerHTML='<div class="empty">No cached matches yet. Open Today and run a check first.</div>';return}grid.innerHTML=matches.map(m=>{const base=window.ArgusEngine.analyze(m),a=window.ArgusGovernance?window.ArgusGovernance.apply(base,m):base,c=a.consensus||base.consensus||{};return `<article class="card"><div class="head"><div><div class="meta">${m.competition||'MATCH'}</div><h3>${m.home} vs ${m.away}</h3></div><span class="status ${c.status||''}">${c.status||'LOW_EVIDENCE'}</span></div><div class="metrics"><div class="metric"><span>Consensus score</span><strong>${c.score??a.modelConsensusScore??'—'}/100</strong></div><div class="metric"><span>Sources</span><strong>${c.sourceCount??'—'}</strong></div><div class="metric"><span>Avg distance</span><strong>${c.averageDistancePct??'—'}%</strong></div><div class="metric"><span>Max distance</span><strong>${c.maxDistancePct??'—'}%</strong></div><div class="metric"><span>Final verdict</span><strong>${a.classification||'—'}</strong></div></div><div class="sources">${(c.sources||[]).join(' · ')||'Not enough independent sources'}${c.blockPromotion?' · PROMOTION BLOCKED':''}</div></article>`}).join('')}setTimeout(render,350);setTimeout(render,1200);</script></body></html>
