<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARGUS · Stars du jour</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fa;color:#142335;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1080px;margin:auto;padding:18px}h1{font-size:clamp(25px,4vw,34px);margin:0 0 6px}p{color:#617082;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:13px;margin:18px 0}.card{background:white;border:1px solid #dce5eb;border-radius:14px;padding:19px}.label{font-size:12px;color:#1a6049;font-weight:800}.price{font-size:25px;font-weight:850;margin:12px 0}.sub{font-size:13px;color:#6a7583}.line{font-size:13px;margin:7px 0}.tag{font-size:12px;background:#fff4dc;color:#885c10;padding:5px 7px;border-radius:7px;display:inline-block;margin:10px 0}.btn{display:inline-block;background:#153f33;color:white;text-decoration:none;border-radius:9px;padding:10px 13px;font-weight:700;margin-top:12px}.notice{background:#fff7e7;border:1px solid #e9dbba;border-radius:10px;padding:12px;font-size:13px}.empty{padding:20px;background:white;border-radius:12px;border:1px solid #e1e6eb}.divider{border-top:1px solid #e8edf1;margin:13px 0}
</style></head><body><main><h1>★ Stars du jour</h1><p id="date">Sélection ARGUS · jusqu'à 3 immeubles · Bruxelles · ≤ 1 400 000 €</p><div class="notice">Sélection éditoriale issue de la recherche approfondie de 8h. Les points non vérifiés restent clairement signalés. Aucune annonce inventée, aucun bien publié pour remplir le quota.</div><div id="status" class="sub" style="margin-top:15px">Analyse des annonces disponibles…</div><div class="grid" id="grid"></div></main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n).toLocaleString('fr-BE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const safe=u=>{try{const a=new URL(u);return /^https?:$/.test(a.protocol)?a.href:'#'}catch{return '#'}};
const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Brussels',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
const part=k=>parts.find(x=>x.type===k)?.value||'';
const today=part('year')+'-'+part('month')+'-'+part('day');
$('date').textContent='Édition du '+new Intl.DateTimeFormat('fr-BE',{timeZone:'Europe/Brussels',day:'numeric',month:'long',year:'numeric'}).format(new Date())+' · 3 sélections maximum';
function card(x,i){
 const proofs=Array.isArray(x.proofs)?x.proofs:[];
 const missing=Array.isArray(x.missing)?x.missing:[];
 const risks=Array.isArray(x.risks)?x.risks:[];
 return '<article class="card"><div class="label">★ '+(i+1)+' · '+esc(x.verdict||'CANDIDAT À CONTRÔLER')+'</div><h2>'+esc(x.title||'Immeuble de rapport')+'</h2><div class="sub">'+esc(x.address||x.commune||'Bruxelles')+'</div><div class="price">'+(Number(x.price)>0?money(x.price):'Prix à vérifier')+'</div><div class="line"><b>Logements :</b> '+esc(x.unitsAnnounced??'?')+' annoncés · '+esc(x.unitsRecognized??'non confirmé')+' reconnus</div><div class="line"><b>PEB :</b> '+esc(x.peb||'à vérifier')+'</div><div class="divider"></div><div class="line"><b>Pourquoi :</b> '+esc(x.why||'À analyser')+'</div><div class="line"><b>Urbanisme :</b> '+esc(x.urbanism||'Non documenté')+'</div><div class="line"><b>État :</b> '+esc(x.condition||'Non documenté')+'</div>'+(proofs.length?'<div class="line"><b>Preuves :</b> '+esc(proofs.join(' · '))+'</div>':'')+(missing.length?'<div class="line"><b>À vérifier :</b> '+esc(missing.join(' · '))+'</div>':'')+(risks.length?'<div class="line"><b>Risques :</b> '+esc(risks.join(' · '))+'</div>':'')+'<a class="btn" href="'+esc(safe(x.url))+'" target="_blank" rel="noopener noreferrer">Annonce originale ↗</a></article>';
}
async function load(){try{
 const r=await fetch('/immo-stars-daily.json?day='+today,{cache:'no-store'});
 if(!r.ok)throw Error('Édition indisponible');
 const j=await r.json();
 if(j.date!==today){$('status').textContent='Édition du jour en attente de publication après la recherche de 8h.';$('grid').innerHTML='<div class="empty">Aucune sélection publiée pour aujourd’hui. Les anciennes annonces ne sont pas recyclées.</div>';return}
 const arr=(j.stars||[]).filter(x=>Number(x.price)>0&&Number(x.price)<=1400000&&Number(x.unitsAnnounced)>=3&&safe(x.url)!=='#').slice(0,3);
 $('status').textContent=arr.length+' sélection(s) publiée(s) · recherche du '+today;
 $('grid').innerHTML=arr.length?arr.map(card).join(''):'<div class="empty">Aucun immeuble répondant suffisamment aux critères aujourd’hui. Aucun bien ajouté artificiellement.</div>';
 }catch(e){$('status').textContent='Publication du jour indisponible';$('grid').innerHTML=''}}
load();
})();
</script></body></html>
